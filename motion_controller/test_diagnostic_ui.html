<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <title>Omni-Morph Motion HW Diagnostic Console (Simulated)</title>
    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --bg: #090a0f;
            --card: #151a22;
            --text: #f1f5f9;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
        }
        h1 {
            color: var(--primary);
            text-align: center;
            text-transform: uppercase;
            font-size: 1.3rem;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 12px rgba(0, 242, 254, 0.4);
        }
        .sim-badge {
            background: #eab308;
            color: #0f172a;
            font-size: 0.65rem;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 20px;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-block;
            text-align: center;
        }
        .header-wrapper {
            text-align: center;
        }
        .card {
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        .section-title {
            font-size: 0.8rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }
        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 180px;
            margin: 20px auto;
        }
        .btn {
            background: #21262d;
            border: 1px solid #30363d;
            color: white;
            padding: 18px;
            border-radius: 12px;
            font-size: 1.3rem;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }
        .btn:active {
            background: var(--primary);
            color: var(--bg);
            border-color: var(--primary);
            transform: scale(0.95);
            box-shadow: 0 0 15px var(--primary);
        }
        .btn-stop {
            background: #ef4444;
            border-color: #ef4444;
        }
        .btn-stop:active {
            background: #b91c1c;
            box-shadow: 0 0 15px #ef4444;
        }
        .btn-pivot {
            background: #273549;
            border-color: #3b4f6a;
            color: #38bdf8;
        }
        .btn-utility {
            background: #334155;
            padding: 10px;
            font-size: 0.8rem;
            border-radius: 8px;
            text-transform: uppercase;
        }
        select {
            width: 100%;
            background: #21262d;
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            outline: none;
            margin-bottom: 10px;
        }
        .hud-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .hud-item {
            background: #0d1117;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }
        .hud-label {
            font-size: 0.7rem;
            color: #8b949e;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .hud-value {
            font-size: 1.15rem;
            color: var(--primary);
            font-weight: bold;
            font-family: monospace;
        }
        .footer {
            text-align: center;
            font-size: 0.7rem;
            color: #64748b;
            margin-top: 20px;
        }
        .console-log {
            background: #0d1117;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 10px;
            font-family: monospace;
            font-size: 0.75rem;
            color: #34d399;
            height: 80px;
            overflow-y: auto;
            margin-top: 10px;
        }
    </style>
    <script>
        let mode = 'MOMENTARY';
        let isLocal = window.location.protocol === 'file:';
        
        // Mock State Variables for Offline Simulation
        let simDist = 120;
        let simAmp = 0.2;
        let simYaw = 0.0;
        let simPitch = 0.0;
        let simSpeed = 185;
        let activeDirection = 'STOP';

        function logConsole(msg) {
            const consoleBox = document.getElementById('console-box');
            if (consoleBox) {
                const time = new Date().toLocaleTimeString();
                consoleBox.innerHTML += `[${time}] ${msg}<br>`;
                consoleBox.scrollTop = consoleBox.scrollHeight;
            }
        }

        function sendCmd(cmd) {
            logConsole(`CMD SENT: CMD:${cmd}`);
            if (isLocal) {
                activeDirection = cmd;
                if (cmd === 'STOP') {
                    simAmp = 0.2;
                } else if (['FORWARD', 'BACKWARD', 'LEFT', 'RIGHT', 'LEFT_PIVOT', 'RIGHT_PIVOT', 'LEFT_PIVOT_BACK', 'RIGHT_PIVOT_BACK'].includes(cmd)) {
                    simAmp = 1.4 + Math.random() * 0.4;
                }
                return;
            }
            fetch('/cmd?val=' + cmd)
                .catch(err => console.error("Send failed:", err));
        }
        
        function handleStart(cmd) {
            sendCmd(cmd);
        }
        
        function handleEnd() {
            if (mode === 'MOMENTARY') {
                sendCmd('STOP');
            }
        }
        
        function updateMode(val) {
            mode = val;
            sendCmd('MODE_' + val);
        }
        
        function updateSpeed(val) {
            if (isLocal) {
                simSpeed = val === 'SLOW' ? 145 : (val === 'FAST' ? 220 : 185);
                logConsole(`SIM SPEED UPDATED: ${val} (${simSpeed} PWM)`);
                return;
            }
            sendCmd('SPEED_' + val);
        }
        
        function pollStatus() {
            if (isLocal) {
                // Run offline simulation calculations (random walk & direction responses)
                if (activeDirection === 'FORWARD') {
                    simDist = Math.max(10, simDist - 5);
                    simPitch = Math.min(15, simPitch + 1);
                } else if (activeDirection === 'BACKWARD') {
                    simDist = Math.min(250, simDist + 4);
                    simPitch = Math.max(-15, simPitch - 1);
                } else if (activeDirection === 'LEFT') {
                    simYaw = (simYaw - 6 + 360) % 360;
                } else if (activeDirection === 'RIGHT') {
                    simYaw = (simYaw + 6) % 360;
                } else if (activeDirection === 'LEFT_PIVOT') {
                    simYaw = (simYaw - 3 + 360) % 360;
                    simDist = Math.max(10, simDist - 2);
                } else if (activeDirection === 'RIGHT_PIVOT') {
                    simYaw = (simYaw + 3) % 360;
                    simDist = Math.max(10, simDist - 2);
                } else if (activeDirection === 'LEFT_PIVOT_BACK') {
                    simYaw = (simYaw - 3 + 360) % 360;
                    simDist = Math.min(250, simDist + 2);
                } else if (activeDirection === 'RIGHT_PIVOT_BACK') {
                    simYaw = (simYaw + 3) % 360;
                    simDist = Math.min(250, simDist + 2);
                } else { // STOP
                    simPitch = simPitch * 0.8; // Level out
                }
                
                // Add minor noise jitters
                simAmp = Math.max(0.1, simAmp + (Math.random() - 0.5) * 0.05);
                simDist = Math.max(2, Math.min(400, simDist + (Math.random() - 0.5) * 0.5));
                simYaw = (simYaw + (Math.random() - 0.5) * 0.2 + 360) % 360;

                // Update UI elements
                document.getElementById('val-dist').innerText = Math.round(simDist) + ' cm';
                document.getElementById('val-amp').innerText = simAmp.toFixed(2) + ' A';
                document.getElementById('val-yaw').innerText = simYaw.toFixed(1) + '°';
                document.getElementById('val-pitch').innerText = simPitch.toFixed(1) + '°';
                document.getElementById('val-speed').innerText = simSpeed + ' PWM';
                document.getElementById('val-mode').innerText = mode;
                return;
            }

            fetch('/status')
                .then(r => r.json())
                .then(data => {
                    document.getElementById('val-dist').innerText = data.dist + ' cm';
                    document.getElementById('val-amp').innerText = data.amps.toFixed(2) + ' A';
                    document.getElementById('val-yaw').innerText = data.yaw.toFixed(1) + '°';
                    document.getElementById('val-pitch').innerText = data.pitch.toFixed(1) + '°';
                    document.getElementById('val-speed').innerText = data.speed + ' PWM';
                    document.getElementById('val-mode').innerText = data.mode;
                    
                    // Sync inputs
                    document.getElementById('mode-select').value = data.mode;
                    if (data.speed <= 150) {
                        document.getElementById('speed-select').value = 'SLOW';
                    } else if (data.speed >= 210) {
                        document.getElementById('speed-select').value = 'FAST';
                    } else {
                        document.getElementById('speed-select').value = 'NORMAL';
                    }
                })
                .catch(err => {});
        }
        
        window.onload = function() {
            if (isLocal) {
                document.getElementById('sim-indicator').style.display = 'inline-block';
                logConsole("Simulation Active. Running local offline loops.");
            } else {
                document.getElementById('sim-indicator').style.display = 'none';
            }
            setInterval(pollStatus, 200);
        };
    </script>
</head>
<body>
    <div class="container">
        <div class="header-wrapper">
            <h1>Motion HW Diagnostics</h1>
            <span id="sim-indicator" class="sim-badge">Simulation Mode</span>
        </div>
        
        <div class="card">
            <div class="section-title">Control Settings</div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;">
                <div>
                    <div style="font-size: 0.65rem; color: #64748b; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px;">Safety Mode</div>
                    <select id="mode-select" onchange="updateMode(this.value)" style="margin-bottom: 0;">
                        <option value="MOMENTARY" selected>MOMENTARY</option>
                        <option value="LATCHING">LATCHING</option>
                    </select>
                </div>
                <div>
                    <div style="font-size: 0.65rem; color: #64748b; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px;">Motor Speed</div>
                    <select id="speed-select" onchange="updateSpeed(this.value)" style="margin-bottom: 0;">
                        <option value="SLOW">SLOW (145)</option>
                        <option value="NORMAL" selected>NORMAL (185)</option>
                        <option value="FAST">FAST (220)</option>
                    </select>
                </div>
            </div>
            
            <div class="d-pad">
                <button class="btn btn-pivot" onmousedown="handleStart('LEFT_PIVOT')" onmouseup="handleEnd()" onmouseleave="handleEnd()" title="Left Pivot Forward">▲◀</button>
                <button class="btn" onmousedown="handleStart('FORWARD')" onmouseup="handleEnd()" onmouseleave="handleEnd()" title="Forward">▲</button>
                <button class="btn btn-pivot" onmousedown="handleStart('RIGHT_PIVOT')" onmouseup="handleEnd()" onmouseleave="handleEnd()" title="Right Pivot Forward">▲▶</button>
                
                <button class="btn" onmousedown="handleStart('LEFT')" onmouseup="handleEnd()" onmouseleave="handleEnd()" title="Spin Left">◀◀</button>
                <button class="btn btn-stop" onclick="sendCmd('STOP')" title="Emergency Stop">■</button>
                <button class="btn" onmousedown="handleStart('RIGHT')" onmouseup="handleEnd()" onmouseleave="handleEnd()" title="Spin Right">▶▶</button>
                
                <button class="btn btn-pivot" onmousedown="handleStart('LEFT_PIVOT_BACK')" onmouseup="handleEnd()" onmouseleave="handleEnd()" title="Left Pivot Backward">▼◀</button>
                <button class="btn" onmousedown="handleStart('BACKWARD')" onmouseup="handleEnd()" onmouseleave="handleEnd()" title="Backward">▼</button>
                <button class="btn btn-pivot" onmousedown="handleStart('RIGHT_PIVOT_BACK')" onmouseup="handleEnd()" onmouseleave="handleEnd()" title="Right Pivot Backward">▼▶</button>
            </div>
        </div>

        <div class="card">
            <div class="section-title">Diagnostics HUD</div>
            <div class="hud-grid" style="grid-template-columns: repeat(3, 1fr);">
                <div class="hud-item">
                    <div class="hud-label">Range</div>
                    <div id="val-dist" class="hud-value">-- cm</div>
                </div>
                <div class="hud-item">
                    <div class="hud-label">Current</div>
                    <div id="val-amp" class="hud-value">-- A</div>
                </div>
                <div class="hud-item">
                    <div class="hud-label">Speed</div>
                    <div id="val-speed" class="hud-value">-- PWM</div>
                </div>
                <div class="hud-item">
                    <div class="hud-label">IMU Yaw</div>
                    <div id="val-yaw" class="hud-value">--°</div>
                </div>
                <div class="hud-item">
                    <div class="hud-label">IMU Pitch</div>
                    <div id="val-pitch" class="hud-value">--°</div>
                </div>
                <div class="hud-item">
                    <div class="hud-label">Mode</div>
                    <div id="val-mode" class="hud-value">--</div>
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="section-title">Direct Utilities</div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <button class="btn btn-utility" onclick="sendCmd('TRANSFORM')">⚡ Transform</button>
                <button class="btn btn-utility" onclick="sendCmd('TEST')">🩺 Self-Test</button>
            </div>
        </div>

        <div class="card">
            <div class="section-title">Console Terminal Out</div>
            <div id="console-box" class="console-log"></div>
        </div>
        
        <div class="footer">
            Direct Web Panel hosted on Motion Control ESP32
        </div>
    </div>
</body>
</html>
