[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.partitions = huge_app.csv

lib_deps =
    ArduinoOTA
    madhephaestus/ESP32Servo @ ^3.0.5
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.2
    electroniccats/MPU6050 @ ^1.3.0
